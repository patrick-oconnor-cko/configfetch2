<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tab icon: a skull with a red/blue cranium split by a lightning bolt.
       Original simplified drawing in the spirit of the "dead head" motif. -->
  <circle cx="50" cy="50" r="48" fill="#fff" stroke="#111" stroke-width="3"/>
  <!-- skull -->
  <path d="M50 12 C28 12 20 28 20 44 C20 56 26 62 30 66 L30 80 C30 86 36 90 42 90 L58 90 C64 90 70 86 70 80 L70 66 C74 62 80 56 80 44 C80 28 72 12 50 12 Z"
        fill="#fff" stroke="#111" stroke-width="3"/>
  <!-- cranium disc: red left, blue right, bolt down the middle -->
  <clipPath id="c"><circle cx="50" cy="40" r="22"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="28" y="18" width="22" height="44" fill="#d61f26"/>
    <rect x="50" y="18" width="22" height="44" fill="#1d4fd7"/>
    <polygon points="56,18 46,40 53,40 42,62 60,36 52,36 62,18" fill="#fff" stroke="#111" stroke-width="1.5"/>
  </g>
  <circle cx="50" cy="40" r="22" fill="none" stroke="#111" stroke-width="3"/>
  <!-- eyes, nose, teeth -->
  <ellipse cx="38" cy="67" rx="7" ry="6" fill="#111"/>
  <ellipse cx="62" cy="67" rx="7" ry="6" fill="#111"/>
  <path d="M50 73 L46 80 L54 80 Z" fill="#111"/>
  <path d="M40 84 V90 M45 85 V90 M50 85 V90 M55 85 V90 M60 84 V90" stroke="#111" stroke-width="2"/>
</svg>
